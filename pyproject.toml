[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-guard-demo"
version = "0.1.0"
description = "A fail-closed, idempotent Parquet batch-pipeline reliability demonstration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agentsor" }]
dependencies = [
  "pyarrow>=16,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<0.14",
]

[project.scripts]
parquet-guard = "parquet_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
