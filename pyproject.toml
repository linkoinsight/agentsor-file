[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsor-file"
version = "0.2.3"
description = "Validate downloaded partner CSV/Parquet feeds and monitor rolling receipt deadlines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Agentsor" }]
keywords = [
  "csv",
  "parquet",
  "data-contracts",
  "schema-validation",
  "file-monitoring",
  "data-freshness",
  "partner-feeds",
  "sftp",
  "s3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyarrow>=16",
]

[project.urls]
Homepage = "https://agentsor.ai/file-contracts"
Repository = "https://github.com/linkoinsight/agentsor-file"
Issues = "https://github.com/linkoinsight/agentsor-file/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<0.14",
]

[project.scripts]
agentsor-file = "parquet_guard.file_cli:main"
parquet-guard = "parquet_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parquet_guard = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
